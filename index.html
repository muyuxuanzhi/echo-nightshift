<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜中来客 · 苔丝与反钟镇</title>
<style>
  :root{
    --scan-op:.06;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#050706;
    font-family:'Consolas','Courier New',monospace;
    overflow:hidden;
  }

  /* ===== 主题：阁楼(苔丝·现在) = 绿色荧光屏 / 反钟镇(格雷·永远的六点) = 蓝色荧光屏 ===== */
  body.theme-a{ --accent:#4dffb8; --accent-dim:#1f6b4d; --bg:#03100b; --glow:0 0 6px rgba(77,255,184,.55); }
  body.theme-b{ --accent:#4da8ff; --accent-dim:#1c4a7a; --bg:#020a14; --glow:0 0 6px rgba(77,168,255,.55); }

  #crt{
    position:relative;width:100vw;height:100vh;
    background:var(--bg);
    color:var(--accent);
    transition:background .5s ease,color .5s ease;
  }
  #crt::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,var(--scan-op)) 0px, rgba(255,255,255,var(--scan-op)) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode:overlay;
  }
  #crt::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
    box-shadow: inset 0 0 120px rgba(0,0,0,.75), inset 0 0 40px rgba(0,0,0,.5);
  }
  @keyframes flicker{
    0%,100%{opacity:1;} 92%{opacity:1;} 93%{opacity:.86;} 94%{opacity:1;} 97%{opacity:.92;}
  }
  #screen{ animation:flicker 6s infinite; height:100%; display:flex; flex-direction:column; }

  /* ===== 顶部栏 ===== */
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px;border-bottom:1px solid var(--accent-dim);
    text-shadow:var(--glow);
    flex-shrink:0;
    gap:16px;
  }
  #topbar .title{font-size:15px;letter-spacing:3px;flex-shrink:0;}
  #topbar .title small{opacity:.6;font-size:11px;letter-spacing:1px;display:block;margin-top:2px;}
  #tl-control{flex:1;display:flex;justify-content:center;align-items:center;}
  .locked-hint{font-size:12px;opacity:.5;letter-spacing:2px;}
  .tl-toggle{
    background:transparent;border:1px solid var(--accent);color:var(--accent);
    padding:7px 20px;font-family:inherit;font-size:12px;letter-spacing:2px;cursor:pointer;
    box-shadow:var(--glow);transition:.2s;
  }
  .tl-toggle:hover{background:var(--accent);color:#000;}
  #clock{font-size:12px;opacity:.7;flex-shrink:0;}

  /* ===== 主体 ===== */
  #body{flex:1;display:flex;min-height:0;position:relative;}
  #nav{
    width:150px;flex-shrink:0;border-right:1px solid var(--accent-dim);
    padding:14px 0;display:flex;flex-direction:column;gap:2px;
  }
  .nav-item{
    padding:10px 18px;cursor:pointer;font-size:13px;letter-spacing:2px;
    opacity:.6;border-left:2px solid transparent;transition:.15s;
  }
  .nav-item:hover{opacity:.9;background:rgba(255,255,255,.03);}
  .nav-item.active{opacity:1;border-left-color:var(--accent);background:rgba(255,255,255,.05);text-shadow:var(--glow);}
  .nav-item .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;opacity:0;vertical-align:middle;}
  .nav-item.has-new .dot{opacity:1;box-shadow:var(--glow);}

  #main{flex:1;padding:20px 26px;overflow-y:auto;min-height:0;}
  #main::-webkit-scrollbar{width:6px;}
  #main::-webkit-scrollbar-thumb{background:var(--accent-dim);}

  .panel-title{font-size:13px;letter-spacing:3px;opacity:.7;margin-bottom:14px;border-bottom:1px dashed var(--accent-dim);padding-bottom:8px;}

  /* 物件列表 */
  .file-row{
    display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;
    border:1px solid transparent;font-size:13px;
  }
  .file-row:hover{border-color:var(--accent-dim);background:rgba(255,255,255,.03);}
  .file-row.locked{opacity:.5;}
  .file-row .icon{opacity:.8;}
  .file-row .name{flex:1;}
  .file-row .tag{font-size:10px;padding:2px 6px;border:1px solid var(--accent-dim);opacity:.7;}

  .doc-view{
    white-space:pre-wrap;line-height:1.9;font-size:13px;padding:16px;
    border:1px solid var(--accent-dim);background:rgba(255,255,255,.02);
    margin-top:10px;
  }
  .back-link{cursor:pointer;opacity:.7;font-size:12px;margin-bottom:10px;display:inline-block;}
  .back-link:hover{opacity:1;}

  /* 书信（写信/看信的展示层） */
  .mail-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;
    border:1px solid transparent;border-bottom:1px solid var(--accent-dim);font-size:13px;
  }
  .mail-row:hover{background:rgba(255,255,255,.03);}
  .mail-row.locked{opacity:.4;cursor:not-allowed;}
  .mail-row .unread-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:var(--glow);flex-shrink:0;}
  .mail-row .unread-dot.hidden{background:transparent;box-shadow:none;}
  .mail-row .mail-from{width:110px;flex-shrink:0;opacity:.85;}
  .mail-row .mail-subject{flex:1;}
  .mail-row .mail-time{opacity:.5;font-size:11px;flex-shrink:0;}
  .mail-row .tag{font-size:10px;padding:2px 6px;border:1px solid var(--accent-dim);opacity:.7;flex-shrink:0;}

  .mail-detail .meta{opacity:.6;font-size:12px;margin-bottom:14px;}
  .mail-detail .subject{font-size:15px;letter-spacing:1px;margin-bottom:4px;text-shadow:var(--glow);}
  .mail-detail .body{white-space:pre-wrap;line-height:1.9;font-size:13px;padding:16px;border:1px solid var(--accent-dim);background:rgba(255,255,255,.02);}

  .compose-toggle-wrap{margin-top:18px;padding-top:14px;border-top:1px dashed var(--accent-dim);}
  .compose-box{margin-top:14px;border:1px solid var(--accent-dim);padding:14px;background:rgba(255,255,255,.02);}
  .compose-box .compose-label{font-size:12px;opacity:.6;margin-bottom:8px;letter-spacing:1px;}
  .compose-box textarea{
    width:100%;min-height:90px;background:transparent;border:1px solid var(--accent-dim);color:var(--accent);
    font-family:inherit;font-size:13px;padding:10px;outline:none;resize:vertical;line-height:1.7;
  }
  .compose-actions{display:flex;gap:10px;margin-top:10px;justify-content:flex-end;}

  /* 镜语（终端） */
  #term-log{font-size:13px;line-height:1.8;white-space:pre-wrap;margin-bottom:8px;}
  #term-log .cmd-echo{opacity:.55;}
  #term-log .cmd-err{color:#ff6767;}
  #term-log .cmd-ok{color:var(--accent);}
  .term-input-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--accent-dim);padding-top:10px;}
  .term-input-row .prompt{opacity:.8;}
  #term-input{
    flex:1;background:transparent;border:none;outline:none;color:var(--accent);
    font-family:inherit;font-size:13px;text-shadow:var(--glow);
  }

  .action-btn{
    background:transparent;border:1px solid var(--accent);color:var(--accent);
    padding:8px 16px;font-family:inherit;cursor:pointer;letter-spacing:1px;font-size:12px;
  }
  .action-btn:hover{background:var(--accent);color:#000;}
  .action-btn.ghost{border-color:var(--accent-dim);color:var(--accent);opacity:.7;}
  .action-btn.ghost:hover{background:transparent;opacity:1;}

  .hint{opacity:.55;font-size:12px;margin-top:14px;line-height:1.7;}

  /* ===== 视频/图片素材占位框 ===== */
  .media-box{
    display:flex;gap:14px;align-items:flex-start;
    border:1px dashed var(--accent-dim);background:rgba(255,255,255,.03);
    padding:14px;margin-top:10px;
  }
  .media-icon{font-size:28px;opacity:.8;flex-shrink:0;line-height:1;}
  .media-info{flex:1;min-width:0;}
  .media-label{font-size:12px;letter-spacing:1px;opacity:.85;margin-bottom:6px;}
  .media-hint{font-size:12px;opacity:.55;line-height:1.6;}
  .media-hint b{opacity:.9;font-weight:normal;color:var(--accent);}

  /* ===== 吐槽独白对话框 ===== */
  .quip-bar{
    position:absolute;left:150px;right:0;bottom:0;
    display:flex;align-items:flex-start;gap:12px;
    padding:12px 22px;background:rgba(0,0,0,.88);
    border-top:1px solid var(--accent-dim);
    transform:translateY(100%);transition:transform .3s ease;
    z-index:20;
  }
  .quip-bar.show{transform:translateY(0);}
  .quip-avatar{
    /* 头像先用纯黑占位，后续替换成正式立绘/头像图 */
    width:42px;height:42px;flex-shrink:0;border:1px solid var(--accent);border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:#000;box-shadow:var(--glow);overflow:hidden;
  }
  .quip-content{flex:1;min-width:0;}
  .quip-name{font-size:10px;letter-spacing:2px;opacity:.55;margin-bottom:4px;}
  .quip-text{font-size:13px;line-height:1.7;text-shadow:var(--glow);}
  .quip-close{flex-shrink:0;cursor:pointer;opacity:.45;font-size:12px;padding:2px 4px;}
  .quip-close:hover{opacity:.9;}

  /* ===== 记忆倒着长：文字递进"想不起来"效果 ===== */
  .glitch-l0{opacity:.95;}
  .glitch-l1{opacity:.88;}
  .glitch-l2{opacity:.8;letter-spacing:.5px;}
  .glitch-l3{opacity:.72;letter-spacing:1px;text-shadow:0 0 3px #ff4d6d;}
  .glitch-l4{opacity:.6;letter-spacing:1.5px;text-shadow:0 0 7px #ff2d55;color:#ffb3c2;}

  /* 系统面板 */
  .flag-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--accent-dim);font-size:12px;}
  .flag-val.on{color:var(--accent);}
  .flag-val.off{opacity:.4;}

  /* 结局遮罩 */
  #ending{
    position:fixed;inset:0;background:#000;color:#4dffb8;z-index:50;
    display:none;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;padding:40px;text-shadow:0 0 8px rgba(77,255,184,.6);
  }
  #ending.show{display:flex;}
  #ending h1{letter-spacing:8px;font-size:22px;margin-bottom:20px;}
  #ending p{max-width:600px;line-height:2;font-size:14px;opacity:.85;margin-bottom:30px;}

  ::selection{background:var(--accent);color:#000;}
</style>
</head>
<body class="theme-b">

<div id="crt"><div id="screen">

  <div id="topbar">
    <div class="title">镜中来客 · 苔丝与反钟镇<small id="title-sub">MIRROR_LINK // 反钟镇 · 永远的下午六点</small></div>
    <div id="tl-control">
      <span id="tl-locked-hint" class="locked-hint">［镜面只映出反钟镇］把该读的信都读完，说不定镜子会展示更多……</span>
      <button id="tl-toggle-btn" class="tl-toggle" style="display:none;"></button>
    </div>
    <div id="clock"></div>
  </div>

  <div id="body">
    <div id="nav">
      <div class="nav-item active" data-app="terminal"><span class="dot"></span>镜语</div>
      <div class="nav-item" data-app="files"><span class="dot"></span>物件</div>
      <div class="nav-item" data-app="mail"><span class="dot"></span>书信</div>
      <div class="nav-item" data-app="system"><span class="dot"></span>镜面状态</div>
    </div>
    <div id="main"></div>
    <div id="quip-bar" class="quip-bar">
      <div class="quip-avatar" id="quip-avatar"></div>
      <div class="quip-content">
        <div class="quip-name">镜子这头的我 · 碎碎念</div>
        <div class="quip-text" id="quip-text"></div>
      </div>
      <div class="quip-close" onclick="hideQuip()">✕</div>
    </div>
  </div>

</div></div>

<div id="ending">
  <h1>MIRROR · END</h1>
  <p id="ending-text"></p>
  <button class="action-btn" onclick="location.reload()">重新开始</button>
</div>

<script>
/* =========================================================
   镜中来客 · 苔丝与反钟镇 —— 爱丽丝式双世界通信 · 可玩骨架 Demo (v1)
   在"双线终端悬疑"骨架基础上，替换全部剧情文本与部分UI文案，
   把惊悚基调改写成爱丽丝式的梦幻荒诞：
   1) 两条"时间线"变成两个世界：反钟镇（格雷 · 记忆倒着长）
      与苔丝的阁楼（现在）。
   2) "存档/读档"仍包装成收发文字，但改叫「写信 / 看信」，
      对应故事里"对着镜子写字，等雾气显字回信"的设定。
   3) 反钟镇 = 蓝色 UI（默认起始）；苔丝的阁楼 = 绿色 UI。
   4) 玩法结构与原骨架一致：读完格雷的引导信 → 解锁【写一段话】→
      两边互相提供解谜数字 → 打开两件上锁的物件 →
      格雷把真相写信投出 → 触发结局。
   ========================================================= */

// ---------- 状态（localStorage 持久化，方便调试/重开） ----------
const STORAGE_KEY = "mirror_visitor_save_v1";

// 两个世界的名字（原方案里"相隔七天的两个日期"，在这里换成"镜子两端的两个世界"）
const DATE_B_SHORT = "反钟镇";
const DATE_A_SHORT = "阁楼";
const DATE_B_FULL = "反钟镇 · 永远的下午六点";
const DATE_A_FULL = "苔丝的阁楼 · 现在";

function defaultState(){
  return {
    timeline: "B",            // 开局固定停留在反钟镇（格雷）这一侧
    introRead: [],            // 已读的引导信 id 列表（顺序解锁）
    sendUnlocked: false,      // 是否已解锁【写一段话】入口（读完最后一封引导信后为 true）
    crossUnlocked: false,     // 是否已解锁镜子两端互看（第一次投信后为 true）
    flags: {
      gotAccessCode: false,     // 苔丝（阁楼）是否已看过旧怀表说明卡，得到数字
      decryptedReport: false,   // 格雷（反钟镇）是否已打开"争执记录"
      reportSent: false,        // 真相是否已经写信投过镜子（触发结局线索）
      endingSeen: false,
      watchedVideo: false,      // 苔丝（阁楼）是否已看过老照片（得到另一串数字）
      decryptedDiary: false,    // 格雷（反钟镇）是否已打开"格雷日记"
      sawPhoto: false,          // 格雷（反钟镇）是否已看过井边的怪照片
    },
    sentMails: [],   // 两个世界之间来回的信 {fromTl,toTl,subject,body,time,isEnding,read}
    filesRead: {},   // 已读物件 key: `${tl}:${name}`
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const merged = defaultState();
      Object.assign(merged, parsed);
      merged.flags = Object.assign(defaultState().flags, parsed.flags || {});
      return merged;
    }
  }catch(e){}
  return defaultState();
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ---------- 引导信链（仅反钟镇 / 格雷一侧，顺序解锁） ----------
const INTRO_MAILS = [
  {
    id:"intro1", from:"钉在木屋门后的木牌", time:"未知钟点",
    subject:"邮差须知（老规矩）",
    body:"天一黑就该出门了：把田里稻草人怀里的纸条,一张张送到井边投进去,今天的差事才算办完。\n\n对了，树杈上那面镜子是镇上公用的，谁都能对着它写两句——但可别乱涂乱画，后面指不定还有谁要用它捎信。",
    quip:"公用的镜子，公用的责任——这套说辞，怎么听着有点耳熟。", mood:"normal"
  },
  {
    id:"intro2", from:"时间树的树洞", time:"下午六点",
    subject:"今天的心愿已经收好了",
    body:"稻草人们今天的纸条,都已经归档存好，如需查看,去「物件」那边翻一翻就是。\n（本消息由树洞自动'沙沙'作响发出，无需回应。）",
    quip:"一棵树都比我认真，自动生成报告，连加班费都不要。", mood:"normal"
  },
  {
    id:"intro3", from:"落款模糊的字条", time:"六点整（大概）",
    subject:"如果有人看到这句话",
    body:"我不知道这句话，会不会有人看见。\n\n如果看见了——说明这面镜子还醒着，说明还有人，愿意对着它写点什么。\n那就好。至少不是只有我一个人，对着一块会反光的木板自言自语。",
    quip:"陌生留言，换我在阁楼收到，多半以为是恶作剧——不过这语气，倒挺真诚的。", mood:"creepy"
  },
  {
    id:"intro4", from:"格雷", time:"六点整（还是大概）",
    subject:"想了很久，还是决定写下来",
    body:"我好像，把一些很重要的事情，倒着忘掉了——连自己是从哪一天开始，困在这永远的六点里，都想不真切。\n\n可镜子里，好像已经浮出来一句回话——问题是，我还没写出对应的那句问句。\n\n算了，管它顺序对不对，我想把眼下能想到的事，好好写一写，当封信投进这面镜子里，试试看，能不能真的送到镜子外头去。\n\n……下面应该会出现【写一段话】的入口了，去试试吧。",
    quip:"糊里糊涂先斩后奏——这操作，我熟，毕竟我交周报也是这个流程。", mood:"creepy"
  },
];

function introMailUnlocked(idx){
  if(idx === 0) return true;
  return state.introRead.includes(INTRO_MAILS[idx-1].id);
}
function allIntroRead(){
  return INTRO_MAILS.every(m => state.introRead.includes(m.id));
}

// ---------- 物件（按世界区分，部分受 flags 控制显隐/锁定） ----------
function getFiles(tl){
  if(tl === "A"){
    return [
      {
        name: "阁楼手记.txt", locked:false,
        quip:"写日记这个习惯，看来我从小就有——不过内容一天比一天离谱。", mood:"normal",
        content: "写在我自己本子上的：\n下雨的星期天,我在阁楼里翻出一面会认字的镜子——不是比喻,是真的会认字。\n镜子那头,好像住着一个后脑勺插着乌鸦羽毛的男孩,还有一整个被卡在下午六点的小镇。\n这事儿要是说给大人听,多半会被送去看医生。所以,先记在这儿,谁都别看。"
      },
      {
        name: "旧怀表的说明卡.txt", locked:false,
        quip:"停在六点的表，配上'欠着一杯茶'——这镜子那头的镇子，多半也卡在同一个点上。", mood:"creepy",
        content: "系在一只停摆怀表链子上的泛黄纸卡：\n『这只表,我说什么也不肯走了。表盘停在——18:00。若有谁能让它重新走动,那这镇子里欠着的一杯茶,也该续上了。』\n落款被虫蛀掉了一半,只留得一个'六'字的偏旁。",
        onRead(){ state.flags.gotAccessCode = true; }
      },
      {
        name: "奶奶的购物清单.txt", locked:false,
        quip:"奶奶买司康饼粉的执念，跟镜子那头吃不完的司康饼，是不是有点缘分。", mood:"normal",
        content: "压在抽屉最底层的一张纸：\n司康饼粉、司康饼粉、司康饼粉、司康饼粉、司康饼粉、司康饼粉、司康饼粉\n黄油　少许\n果酱　随意\n（写着写着好像陷进去出不来了，最后歪歪扭扭地补了一句：算了，直接多买点吧。）"
      },
      {
        name: "老照片.jpg", locked:false,
        mediaType:"image",
        mediaName:"image/old_photo_clock.jpg",

// ---------- 渲染 ----------
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const mainEl = $("#main");

function charName(tl){
  return tl === "A" ? "苔丝" : "格雷";
}

function applyTheme(){
  document.body.className = state.timeline === "A" ? "theme-a" : "theme-b";
  $("#title-sub").textContent = state.timeline === "A"
    ? "MIRROR_LINK // " + DATE_A_FULL
    : "MIRROR_LINK // " + DATE_B_FULL;
  renderTopControl();
}

function renderTopControl(){
  const hint = $("#tl-locked-hint");
  const btn = $("#tl-toggle-btn");
  if(state.crossUnlocked){
    hint.style.display = "none";
    btn.style.display = "inline-block";
    btn.textContent = state.timeline === "A" ? ("◀ 切换至 · " + DATE_B_SHORT) : ("切换至 · " + DATE_A_SHORT + " ▶");
  }else{
    hint.style.display = "inline-block";
    btn.style.display = "none";
  }
}

function toggleTimeline(){
  if(!state.crossUnlocked) return;
  state.timeline = state.timeline === "A" ? "B" : "A";
  applyTheme();
  saveState();
  renderApp(currentApp);
  renderNavDots();
}

let currentApp = "terminal";

function switchApp(app){
  currentApp = app;
  $$(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.app === app));
  renderApp(app);
}

function renderApp(app){
  if(app === "terminal") return renderTerminal();
  if(app === "files") return renderFiles();
  if(app === "mail") return renderMail();
  if(app === "system") return renderSystem();
}

// ---- 物件面板 ----
function renderFiles(fileToOpen){
  const files = getFiles(state.timeline);
  if(fileToOpen){
    const f = files.find(x => x.name === fileToOpen);
    if(f && !f.locked){
      markFileRead(f);
      mainEl.innerHTML = `
        <div class="panel-title">物件 // ${state.timeline === "A" ? DATE_A_SHORT : DATE_B_SHORT}</div>
        <span class="back-link" onclick="renderFiles()">&laquo; 返回物件列表</span>
        ${renderMediaBox(f)}
        <div class="doc-view">${escapeHtml(f.content)}</div>
      `;
      showQuip(f.quip || randomQuip("file"), f.mood || "normal");
      return;
    }
  }
  mainEl.innerHTML = `
    <div class="panel-title">物件 // ${state.timeline === "A" ? DATE_A_SHORT : DATE_B_SHORT}</div>
    ${files.map(f => `
      <div class="file-row ${f.locked?"locked":""}" onclick="${f.locked?"quipLockedFile()":`renderFiles('${f.name}')`}">
        <span class="icon">${f.locked ? "🔒" : (f.mediaType === "video" ? "🎞" : f.mediaType === "image" ? "🖼" : "📄")}</span>
        <span class="name">${f.name}</span>
        ${f.locked ? '<span class="tag">上锁</span>' : (f.mediaType ? `<span class="tag">${f.mediaType==="video"?"影像":"照片"}</span>` : "")}
      </div>
    `).join("")}
    <div class="hint">提示：在「镜语」里可以用 <b>ls</b> 看看有什么物件、<b>cat 名称</b> 细看、<b>decrypt 名称 数字</b> 打开上锁的物件。</div>
  `;
}

function renderMediaBox(f){
  if(!f.mediaType) return "";
  const icon = f.mediaType === "video" ? "🎞" : "🖼";
  const label = f.mediaType === "video" ? "影像素材占位" : "照片素材占位";
  return `
    <div class="media-box">
      <div class="media-icon">${icon}</div>
      <div class="media-info">
        <div class="media-label">［${label}］建议文件名：${escapeHtml(f.mediaName||"")}</div>
        <div class="media-hint">${f.mediaHint||""}</div>
      </div>
    </div>
  `;
}

function markFileRead(f){
  const key = `${state.timeline}:${f.name}`;
  if(!state.filesRead[key]){
    state.filesRead[key] = true;
    if(typeof f.onRead === "function") f.onRead();
    saveState();
  }
}

function escapeHtml(str){
  return str.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

// ---- 碎碎念系统：点击信件/物件/解谜物品时，主角发表评论 ----
const QUIP_POOL = {
  mail: ["已读。这信写得，比镇上的公告牌靠谱多了。","一封信而已，慌什么——我见过比这更离谱的邀请函，还是我自己写的。","收到，继续办差事，反正也没有司康饼在等着。","这年头，连镜子写信都比某些人靠谱。"],
  file: ["字不少，但读起来比数学作业有意思多了。","继续翻，说不定下一页就写着'恭喜你，谜底揭晓'。","这种阅读速度，拿去对付作业该多好。"],
  fileLocked: ["锁上了——跟我数学作业的解法一样，锁得死死的。","上锁？合着连一张纸条都要卷密码。"],
  decryptFail: ["数字不对——白激动一场，血压算是白升了。"],
  decryptOk: ["解开了！好奇心这东西，跟司康饼一样，一上头就停不下来。"],
};
let quipTimer = null;
function showQuip(text, mood){
  if(!text) return;
  const bar = $("#quip-bar");
  const avatar = $("#quip-avatar");
  if(!bar) return;
  $("#quip-text").textContent = text;
  // 头像先用纯黑图占位，仅通过描边颜色区分情绪，不再用emoji
  avatar.style.borderColor = mood === "creepy" ? "#ff4d6d" : mood === "fail" ? "#ff9a5a" : "var(--accent)";
  bar.classList.add("show");
  clearTimeout(quipTimer);
  quipTimer = setTimeout(() => bar.classList.remove("show"), 7000);
}
function hideQuip(){ clearTimeout(quipTimer); $("#quip-bar").classList.remove("show"); }
function randomQuip(pool){
  const arr = QUIP_POOL[pool] || [];
  return arr.length ? arr[Math.floor(Math.random() * arr.length)] : "";
}
function quipLockedFile(){ showQuip(randomQuip("fileLocked"), "normal"); }
function quipLockedMail(){ showQuip("上一封信还没读完呢，先按顺序来。", "normal"); }

// ---- 书信面板（写信/看信的展示层） ----
let composeOpen = false;

function buildMailList(tl){
  // 信箱 = 固定引导信链（仅反钟镇一侧） + 两个世界之间来回收到的信
  const list = [];
  if(tl === "B"){
    INTRO_MAILS.forEach((m, idx) => {
      list.push({
        kind:"intro", id:m.id, from:m.from, time:m.time, subject:m.subject, body:m.body,
        locked: !introMailUnlocked(idx),
        read: state.introRead.includes(m.id),
        quip:m.quip, mood:m.mood,
      });
    });
  }else{
    list.push({
      kind:"sys", id:"sys-welcome", from:"镜子的雾气", time:"今天 上午",
      subject:"阁楼有点不对劲",
      body:"你最近是不是总盯着那面旧镜子看？镜面偶尔泛起的雾气，好像不是普通的灰尘。\n如果发现什么奇怪的字迹，别急着擦掉。（本提醒自动出现，无法回复。）",
      locked:false, read: state.filesRead["A:__sys-welcome"] === true,
      quip:"这算哪门子的智能家居提醒，比我家扫地机器人还有灵性。", mood:"creepy",
    });
    if(state.flags.watchedVideo){
      list.push({
        kind:"sys2", id:"sys-warning", from:"镜子里飘来的字条", time:"今天 稍晚",
        subject:"你不该翻到那张照片的",
        body:"那张照片本来压在相册最底下——不过既然翻到了，那就……祝你好运？\n有些数字，看见了就很难装作没看见。",
        locked:false, read: state.filesRead["A:__sys-warning"] === true,
        quip:"被一面镜子将了一军，这售后服务态度真是一言难尽。", mood:"creepy",
      });
    }
  }
  state.sentMails
    .filter(m => m.toTl === tl)
    .forEach(m => list.push({
      kind:"received", id:m.id, from: m.fromTl === "A" ? ("来自" + DATE_A_SHORT + "的信") : ("来自" + DATE_B_SHORT + "的信"),
      time:m.time, subject:m.subject, body:m.body, locked:false, read:m.read, isEnding:m.isEnding,
      quip: m.isEnding ? "信到了。深呼吸一下，再点开看看写了什么。" : undefined,
    }));
  return list;
}

function renderMail(openId){
  const list = buildMailList(state.timeline);

  if(openId){
    const m = list.find(x => x.id === openId);
    if(m && !m.locked){
      markMailRead(m);
      mainEl.innerHTML = `
        <div class="panel-title">书信 // ${state.timeline === "A" ? DATE_A_SHORT : DATE_B_SHORT}</div>
        <span class="back-link" onclick="renderMail()">&laquo; 返回信箱</span>
        <div class="mail-detail">
          <div class="subject">${escapeHtml(m.subject)}</div>
          <div class="meta">发件人：${escapeHtml(m.from)}　${escapeHtml(m.time)}</div>
          <div class="body">${escapeHtml(m.body)}</div>
        </div>
      `;
      showQuip(m.quip || randomQuip("mail"), m.mood || "normal");
      if(m.isEnding) setTimeout(triggerEnding, 900);
      renderNavDots();
      return;
    }
  }

  mainEl.innerHTML = `
    <div class="panel-title">书信 // ${state.timeline === "A" ? DATE_A_SHORT : DATE_B_SHORT}</div>
    ${list.map(m => `
      <div class="mail-row ${m.locked?"locked":""}" onclick="${m.locked?"quipLockedMail()":`renderMail('${m.id}')`}">
        <span class="unread-dot ${m.read?"hidden":""}"></span>
        <span class="mail-from">${m.locked ? "?????" : escapeHtml(m.from)}</span>
        <span class="mail-subject">${m.locked ? "〔尚未解锁〕" : escapeHtml(m.subject)}</span>
        <span class="mail-time">${m.locked ? "" : escapeHtml(m.time)}</span>
        ${m.locked ? '<span class="tag">未读上一封</span>' : ""}
      </div>
    `).join("")}
    ${renderComposeSection()}
  `;
  if(composeOpen){
    const ta = $("#compose-text");
    if(ta) ta.focus();
  }
}

function renderComposeSection(){
  if(!state.sendUnlocked){
    return `<div class="hint">把信按顺序读完，也许会有新的东西解锁……</div>`;
  }
  if(!composeOpen){
    return `
      <div class="compose-toggle-wrap">
        <button class="action-btn" onclick="openCompose()">🕯 在镜子上写一段话</button>
      </div>
    `;
  }
  const draft = defaultDraft();
  return `
    <div class="compose-box">
      <div class="compose-label">这段话会被送到：${state.timeline === "B" ? DATE_A_SHORT : DATE_B_SHORT}</div>
      <textarea id="compose-text">${escapeHtml(draft)}</textarea>
      <div class="compose-actions">
        <button class="action-btn ghost" onclick="closeCompose()">取消</button>
        <button class="action-btn" onclick="sendComposedMail()">投进镜子</button>
      </div>
    </div>
  `;
}

function defaultDraft(){
  if(state.timeline === "B" && state.flags.decryptedReport && !state.flags.reportSent){
    let base = "我搞清楚了。反钟镇的钟停在六点，是因为大摆钟和六点先生赌气吵了一架，谁也不肯先服软。\n如果你那边有什么点子，能让两个死要面子的家伙体面地和好——请一定告诉我。";
    if(state.flags.decryptedDiary){
      base += "\n\n我还翻到自己的一本日记，写日记的“我”说，总有一天会等到一个记性和我们不一样的人。我猜，那大概就是你。";
    }
    return base;
  }
  if(state.timeline === "B" && !state.crossUnlocked){
    return "如果这面镜子真能把话送到镜子外头——那我想说，我好像被困在一场总也走不完的下午六点里了。你那边，一切都还正常吗？";
  }
  return "谢谢你的点子，这边一切都顺利，我会把后续也讲给你听的。";
}

function openCompose(){ composeOpen = true; renderMail(); }
function closeCompose(){ composeOpen = false; renderMail(); }

function sendComposedMail(){
  const ta = $("#compose-text");
  const text = ta ? ta.value.trim() : "";
  if(!text) return;

  const fromTl = state.timeline;
  const toTl = fromTl === "A" ? "B" : "A";
  const firstTime = !state.crossUnlocked;
  const isReportMail = fromTl === "B" && state.flags.decryptedReport && !state.flags.reportSent;

  const mail = {
    id: "m" + Date.now(),
    fromTl, toTl,
    subject: isReportMail ? "关于那场争执，我都搞清楚了" : (firstTime ? "第一次投进镜子里的话" : "捎来的话"),
    body: text,
    time: nowLabel(),
    isEnding: isReportMail,
    read: false,
  };
  state.sentMails.unshift(mail);

  if(isReportMail) state.flags.reportSent = true;
  if(!state.crossUnlocked) state.crossUnlocked = true;

  composeOpen = false;
  saveState();
  applyTheme();
  renderMail();
  renderNavDots();
}

function markMailRead(m){
  if(m.kind === "intro"){
    if(!state.introRead.includes(m.id)){
      state.introRead.push(m.id);
      if(allIntroRead()) state.sendUnlocked = true;
      saveState();
    }
  }else if(m.kind === "sys" || m.kind === "sys2"){
    const key = "A:__" + m.id;
    if(!state.filesRead[key]){ state.filesRead[key] = true; saveState(); }
  }else if(m.kind === "received"){
    const rec = state.sentMails.find(x => x.id === m.id);
    if(rec && !rec.read){ rec.read = true; saveState(); }
  }
}

function nowLabel(){
  const d = new Date();
  return (state.timeline === "A" ? DATE_A_SHORT + " " : DATE_B_SHORT + " ") + d.toLocaleTimeString("zh-CN",{hour12:false});
}

    <div class="hint">写信 / 看信在本作里就是「存档 / 读档」：写一段话 = 存档，翻开书信 = 读档。<br>第一次投出信件会连通镜子两端；在${DATE_B_SHORT}解开争执记录后再写一段话，会把真相送到${DATE_A_SHORT}，触发结局。</div>
    <div style="margin-top:24px;">
      <button class="action-btn" onclick="if(confirm('确定要重置全部进度吗？')){localStorage.removeItem('${STORAGE_KEY}');location.reload();}">重置存档</button>
    </div>
  `;
}

// ---- 镜语（终端） ----
let termHistory = [];

// 可打开物件配置表（供 decrypt 命令通用查找）
const DECRYPT_TARGETS = {
  "争执记录": {
    password: "1800",
    prereqFlag: "gotAccessCode",
    prereqHint: "数字对不上——你好像还不知道那只停摆的怀表，表盘定格在几点。（提示：去『阁楼』那侧找找旧怀表的说明卡）",
    doneFlag: "decryptedReport",
    successMsg: "锁开了。物件已生成：争执记录.txt",
  },
  "格雷日记": {
    password: "0601",
    prereqFlag: "watchedVideo",
    prereqHint: "数字对不上——你好像还没看过什么能提示这串数字的东西。（提示：去『阁楼』那侧看看那张老照片）",
    doneFlag: "decryptedDiary",
    successMsg: "锁开了。物件已生成：格雷日记.txt",
  },
};

function renderTerminal(){
  mainEl.innerHTML = `
    <div class="panel-title">镜语 // ${state.timeline === "A" ? DATE_A_SHORT : DATE_B_SHORT}</div>
    <div id="term-log"></div>
    <div class="term-input-row">
      <span class="prompt">${charName(state.timeline)} ❯</span>
      <input id="term-input" type="text" autocomplete="off" placeholder="输入 help 查看能做的事" />
    </div>
  `;
  renderTermLog();
  const input = $("#term-input");
  input.focus();
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){
      const cmd = input.value;
      input.value = "";
      runCommand(cmd);
    }
  });
  if(termHistory.length === 0){
    pushLog("欢迎对着镜子低语。输入 <b>help</b> 查看能做的事。", "cmd-ok");
  }
}

function renderTermLog(){
  const log = $("#term-log");
  if(!log) return;
  log.innerHTML = termHistory.map(l => `<div class="${l.cls||""}">${l.text}</div>`).join("");
  const mainBox = $("#main");
  mainBox.scrollTop = mainBox.scrollHeight;
}

function pushLog(text, cls){
  termHistory.push({text, cls});
  renderTermLog();
}

function runCommand(raw){
  const cmd = raw.trim();
  if(!cmd) return;
  pushLog(`<span class="cmd-echo">${charName(state.timeline)} ❯ ${escapeHtml(cmd)}</span>`);
  const parts = cmd.split(/\s+/);
  const verb = parts[0].toLowerCase();
  const files = getFiles(state.timeline);

  if(verb === "help"){
    pushLog(
`可用命令：
  ls                     看看这边有什么物件
  cat &lt;名称&gt;              细看某个物件
  decrypt &lt;名称&gt; &lt;数字&gt;    用数字打开上锁的物件（仅反钟镇一侧可用）
  whoami                 试着想起自己是谁
  clear                  把这些话从镜面上擦掉

提示：写信 / 看信请去左侧「书信」；照片类物件用 cat 只能看文字描述，完整画面请去「物件」面板查看。`, "cmd-ok");
  }
  else if(verb === "ls"){
    pushLog(files.map(f => {
      const icon = f.locked ? "🔒" : (f.mediaType === "video" ? "🎞" : f.mediaType === "image" ? "🖼" : "📄");
      return `${icon} ${f.name}`;
    }).join("\n"));
  }
  else if(verb === "cat"){
    const name = parts.slice(1).join(" ");
    const f = files.find(x => x.name === name);
    if(!f){ pushLog(`找不到这个物件：${escapeHtml(name)}`, "cmd-err"); }
    else if(f.locked){ pushLog(`这东西还锁着，没法直接看：${escapeHtml(name)}`, "cmd-err"); }
    else{
      markFileRead(f);
      pushLog(escapeHtml(f.content));
      if(f.mediaType){
        pushLog(`（提示：该物件包含${f.mediaType==="video"?"影像":"照片"}素材，去「物件」面板可以看到画面占位）`, "cmd-echo");
      }
      showQuip(f.quip || randomQuip("file"), f.mood || "normal");
    }
  }
  else if(verb === "decrypt"){
    if(state.timeline !== "B"){
      pushLog("镜子照进" + DATE_A_SHORT + "这一侧，没有需要打开的上锁物件。", "cmd-err");
    }else{
      const name = parts[1];
      const code = parts[2];
      const target = DECRYPT_TARGETS[name];
      if(!name || !code){ pushLog("用法：decrypt <名称> <四位数字>", "cmd-err"); }
      else if(!target){ pushLog(`找不到能打开的物件：${escapeHtml(name)}`, "cmd-err"); }
      else if(state.flags[target.doneFlag]){ pushLog(`这东西已经打开过了，用 cat ${name}.txt 看看。`, "cmd-ok"); }
      else if(!state.flags[target.prereqFlag]){
        pushLog(target.prereqHint, "cmd-err");
        showQuip(randomQuip("decryptFail"), "fail");
      }
      else if(code === target.password){
        state.flags[target.doneFlag] = true;
        saveState();
        pushLog(target.successMsg, "cmd-ok");
        showQuip(randomQuip("decryptOk"), "ok");
      }else{
        pushLog("数字不对。", "cmd-err");
        showQuip(randomQuip("decryptFail"), "fail");
      }
    }
  }
  else if(verb === "whoami"){
    revealGlitchIdentity();
  }
  else if(verb === "clear"){
    termHistory = [];
    renderTermLog();
  }
  else{
    pushLog(`看不懂这句话：${escapeHtml(verb)}（输入 help 查看能做的事）`, "cmd-err");
  }
}

// ---- 记忆倒着长：试着想起自己是谁（递进式文字模糊，改自"文字腐蚀"梗，改走轻松路线）----
function revealGlitchIdentity(){
  pushLog("正在试着想起自己是谁……", "cmd-echo");
  const lines = [
    "我叫……",
    "我叫格雷，应该是。",
    "格靁，等等，这样对嗎",
    "格靁鎃，鏡孒也開始犯迷糊叻",
    "……算了，喝口茶，喝完再想。",
  ];
  lines.forEach((line, i) => {
    setTimeout(() => {
      pushLog(line, `glitch-l${i}`);
      if(i === lines.length - 1){
        setTimeout(() => {
          pushLog("……身份核对已放弃，喝茶去了。", "cmd-err");
          showQuip("好家伙，连自己名字都要现想，这键盘我先收好。", "creepy");
        }, 500);
      }
    }, i * 700);
  });
}

// ---- 结局 ----
function triggerEnding(){
  if(state.flags.endingSeen) return;
  state.flags.endingSeen = true;
  saveState();
  let extra = "";
  if(state.flags.sawPhoto){
    extra = "\n\n后来我才想明白，井水里那道多出来的轮廓，大概就是隔着一整面镜子，正在读这段话的另一个人。";
  }
  $("#ending-text").textContent =
    "一面镜子，两个世界，一场谁也不肯先服软的争执。\n我们隔着一整场“倒着长的记忆”，用一封又一封荒唐的信，把事情，慢慢拼对了。" + extra + "\n\n（镜中来客 · 苔丝与反钟镇 · 可玩骨架 Demo · 完）";
  $("#ending").classList.add("show");
}

// ---- 左侧导航未读提示 ----
function renderNavDots(){
  const mailUnread = buildMailList(state.timeline).some(m => !m.locked && !m.read);
  $$(".nav-item").forEach(n => {
    if(n.dataset.app === "mail") n.classList.toggle("has-new", mailUnread);
  });
}

// ---- 时钟 ----
function tickClock(){
  const d = new Date();
  $("#clock").textContent = (state.timeline === "A" ? "MIRROR@" + DATE_A_SHORT + " " : "MIRROR@" + DATE_B_SHORT + " ") + d.toLocaleTimeString("zh-CN",{hour12:false});
}
setInterval(tickClock, 1000);

// ---- 事件绑定 ----
$("#tl-toggle-btn").addEventListener("click", toggleTimeline);
$$(".nav-item").forEach(nav => nav.addEventListener("click", () => switchApp(nav.dataset.app)));

// ---- 初始化 ----
applyTheme();
tickClock();
renderApp(currentApp);
renderNavDots();
</script>
</body>
